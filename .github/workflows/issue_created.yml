name: Issue Created

on:
  issues:
    types: [opened]

jobs:
  handle-feature-issue:
    if: contains(github.event.issue.title, '[Feat]')
    runs-on: ubuntu-latest
    steps:
      - name: Create branch for feature
        uses: peter-evans/create-branch@v5
        with:
          branch: ${{ github.event.issue.title }}
          base: main

      - name: Move issue to To-Do
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.projects.updateCard({
              card_id: context.payload.project_card.id,
              state: "Todo"
            })
