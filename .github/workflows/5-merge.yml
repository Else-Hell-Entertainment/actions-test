
name: Auto Integration

on:
  pull_request:
    types: [closed]

jobs:
  merge-task:
    if: contains(github.event.pull_request.labels.*.name, 'task') && github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Rebase merge already done by GitHub UI
        run: echo "Merged task PR"

      - name: Move issue to Latest Build
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.projects.updateCard({
              card_id: context.payload.pull_request.issue.project_card.id,
              state: "Latest Build"
            })

  merge-feature:
    if: contains(github.event.pull_request.labels.*.name, 'feature') && github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Create merge commit (features)
        run: echo "Merged feature PR"

      - name: Move issue to Latest Build
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.projects.updateCard({
              card_id: context.payload.pull_request.issue.project_card.id,
              state: "Latest Build"
            })
