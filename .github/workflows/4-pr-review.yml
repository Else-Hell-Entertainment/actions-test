
name: PR Review Automation

on:
  pull_request_review:
    types: [submitted]

jobs:
  handle-review:
    runs-on: ubuntu-latest
    steps:
      - name: Handle Change Requests
        if: github.event.review.state == 'changes_requested'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.projects.updateCard({
              card_id: context.payload.pull_request.issue.project_card.id,
              state: "In Progress"
            })

      - name: Handle Approvals
        if: github.event.review.state == 'approved'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.projects.updateCard({
              card_id: context.payload.pull_request.issue.project_card.id,
              state: "Done"
            })
