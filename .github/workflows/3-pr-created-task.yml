
name: Pull Request Automation

on:
  pull_request:
    types: [opened]

jobs:
  task-pr:
    if: contains(github.event.pull_request.labels.*.name, 'task')
    runs-on: ubuntu-latest
    steps:
      - name: Set PR metadata for Task
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = context.payload.pull_request.title.replace("Implement ", "");
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              title: `Implement ${issueTitle}`
            });

      - name: Move issue to In Review
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.projects.updateCard({
              card_id: context.payload.pull_request.issue.project_card.id,
              state: "In Review"
            })

  feature-pr:
    if: contains(github.event.pull_request.labels.*.name, 'feature')
    runs-on: ubuntu-latest
    steps:
      - name: Set PR title for feature
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = context.payload.pull_request.title;
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              title: `Feat: ${issueTitle}`
            });

      - name: Move issue to In Review
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.projects.updateCard({
              card_id: context.payload.pull_request.issue.project_card.id,
              state: "In Review"
            })
